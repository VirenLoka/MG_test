# dmax binary maximum-degradation classification.
# 3280 rows, 2529 unique molecules, 18 targets, 49.6% positive.
defaults: base.yaml

experiment:
  name: mg_crossattn_dmax

paths:
  data_csv: MG_data/patglue_dmax_clean.csv

data:
  label_col: dmax_label

# dmax has fewer targets (18) and far more extreme per-target label skew
# (CDK2 1.3% positive, VAV1 90.3%). The MACCS-only baseline scored 0.429 test
# ROC-AUC here - below chance - so the protein stream has to do real work.
# A slightly deeper cross-attention stack gets more chance to use it, and the
# stronger dropout guards the small effective target-space sample size.
model:
  cross_attention:
    n_blocks: 3
  classifier:
    dropout: 0.3

split:
  paralog_families:
    - [SMARCA2, SMARCA4]
    - [IKZF1, IKZF2, IKZF3, IKZF4]
    # dmax additionally has CDK2 and GSPT1 sharing 101 scaffolds despite not
    # being paralogs; keeping them together prevents a 58% row loss on CDK2.
    - [CDK2, GSPT1]
