# dmax binary maximum-degradation classification.
# 3280 rows, 2529 unique molecules, 18 targets, 49.6% positive.
defaults: base.yaml

experiment:
  name: mg_crossattn_dmax

paths:
  data_csv: MG_data/patglue_dmax_clean.csv

data:
  label_col: dmax_label

# dmax has fewer targets (18) and far more extreme per-target label skew
# (CDK2 1.3% positive, VAV1 90.3%). The MACCS-only baseline scored 0.429 test
# ROC-AUC here - below chance - so the protein stream has to do real work.
# A slightly deeper cross-attention stack gets more chance to use it, and the
# stronger dropout guards the small effective target-space sample size.
model:
  cross_attention:
    n_blocks: 3
  classifier:
    dropout: 0.3

split:
  # CDK2 and GSPT1 were previously pinned together here. They are not paralogs
  # - the grouping existed only because they share 101 scaffolds, which cost
  # CDK2 58% of its rows once scaffold-disjointness was imposed. With that off
  # (see base.yaml) nothing is dropped, so the grouping has no remaining job,
  # and it was an expensive one: together they are an indivisible 801-row block
  # at 4.0% positive, a quarter of the dataset, which pinned one fold at a 4.8%
  # positive rate no matter how the rest were arranged. Split apart they are
  # 387 rows at 1.3% and 414 at 6.5%, which the balancer can place separately.
  paralog_families:
    - [SMARCA2, SMARCA4]
    - [IKZF1, IKZF2, IKZF3, IKZF4]
